<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="H-bitos" />
  <meta name="theme-color" content="#0f0f13" />
  <title>H-bitos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --border: #2e2e3e;
      --accent: #7c6ff7;
      --accent2: #5de8c1;
      --text: #e8e8f0;
      --muted: #888899;
      --danger: #f26a6a;
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 28px 16px calc(32px + var(--safe-bottom));
      -webkit-tap-highlight-color: transparent;
    }

    #app { width: 100%; max-width: 480px; }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 28px; }

    header h1 {
      font-size: 2.6rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1.5px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4px;
      text-transform: capitalize;
    }

    /* ── Add form ── */
    .add-habit { margin-bottom: 18px; }

    #add-form { display: flex; gap: 8px; }

    #habit-input {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      padding: 14px 16px;
      outline: none;
      -webkit-appearance: none;
      min-width: 0;
    }
    #habit-input:focus { border-color: var(--accent); }
    #habit-input::placeholder { color: var(--muted); }

    #habit-emoji {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1.2rem;
      padding: 0 10px;
      cursor: pointer;
      outline: none;
      -webkit-appearance: none;
      min-width: 52px;
    }

    #add-form button[type="submit"] {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 20px;
      white-space: nowrap;
      min-width: 52px;
    }
    #add-form button[type="submit"]:active { opacity: 0.75; }

    /* ── Progress ── */
    .progress-bar-section { margin-bottom: 20px; }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .progress-track {
      background: var(--surface2);
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* ── Habits list ── */
    #habits-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .habit-item {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 14px;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .habit-item.done {
      border-color: var(--accent2);
      background: color-mix(in srgb, var(--accent2) 8%, var(--surface));
    }

    /* Checkbox touch-friendly */
    .habit-check {
      appearance: none;
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }
    .habit-check:checked { background: var(--accent2); border-color: var(--accent2); }
    .habit-check:checked::after {
      content: "✓";
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #0f0f13;
      font-size: 14px;
      font-weight: 900;
    }

    .habit-emoji { font-size: 1.5rem; line-height: 1; flex-shrink: 0; }

    .habit-info { flex: 1; min-width: 0; }

    .habit-name {
      font-size: 0.97rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .habit-item.done .habit-name { text-decoration: line-through; color: var(--muted); }

    .habit-streak { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }
    .habit-streak.hot { color: #ffb347; }

    /* Delete button — siempre visible en móvil */
    .habit-del {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 6px 9px;
      flex-shrink: 0;
      line-height: 1;
    }
    .habit-del:active { color: var(--danger); border-color: var(--danger); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 52px 0;
      line-height: 1.8;
      font-size: 0.95rem;
    }

    /* ── Stats ── */
    .stats-section { margin-top: 32px; }

    .stats-section h2 {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .stat-value {
      font-size: 1.7rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Banner "Agregar a inicio" ── */
    #install-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
    #install-banner span { flex: 1; }
    #install-banner button {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 8px 14px;
      white-space: nowrap;
    }
    #install-close {
      background: none !important;
      border: none !important;
      color: var(--muted) !important;
      font-size: 1rem !important;
      padding: 4px 6px !important;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>H-bitos</h1>
    <p class="subtitle" id="date-display"></p>
  </header>

  <div id="install-banner">
    <span>📲 Agrégala a tu pantalla de inicio para usarla como app</span>
    <button id="install-btn">Instalar</button>
    <button id="install-close">✕</button>
  </div>

  <section class="add-habit">
    <form id="add-form">
      <input id="habit-input" type="text" placeholder="Nuevo hábito…" maxlength="60" autocomplete="off" autocorrect="off" />
      <select id="habit-emoji">
        <option>✅</option><option>💪</option><option>📚</option>
        <option>🏃</option><option>🧘</option><option>💧</option>
        <option>🍎</option><option>😴</option><option>🎯</option><option>🌱</option>
      </select>
      <button type="submit">+</button>
    </form>
  </section>

  <section class="progress-bar-section" id="progress-section" style="display:none">
    <div class="progress-label">
      <span id="progress-text">0 / 0 hoy</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </section>

  <ul id="habits-list"></ul>
  <div class="empty-state" id="empty-state">Sin hábitos todavía.<br/>¡Agrega uno para empezar! 🚀</div>

  <section class="stats-section" id="stats-section" style="display:none">
    <h2>Estadísticas</h2>
    <div class="stats-grid" id="stats-grid"></div>
  </section>
</div>

<script>
  const KEY = "habitos_data";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || { habits: [] }; } catch { return { habits: [] }; } };
  const save = s => localStorage.setItem(KEY, JSON.stringify(s));
  let state = load();

  const todayKey = () => new Date().toISOString().slice(0, 10);
  const yesterdayKey = () => { const d = new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); };

  function formatDate(k) {
    return new Date(k + "T12:00:00").toLocaleDateString("es-ES", { weekday:"long", year:"numeric", month:"long", day:"numeric" });
  }

  function computeStreak(h) {
    if (!h.completedDays?.length) return 0;
    const days = [...h.completedDays].sort().reverse();
    if (days[0] !== todayKey() && days[0] !== yesterdayKey()) return 0;
    let s = 1;
    for (let i = 1; i < days.length; i++) {
      const diff = Math.round((new Date(days[i-1]+"T12:00:00") - new Date(days[i]+"T12:00:00")) / 86400000);
      if (diff === 1) s++; else break;
    }
    return s;
  }

  function esc(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function render() {
    const today = todayKey();
    const { habits } = state;

    document.getElementById("empty-state").style.display = habits.length ? "none" : "block";
    document.getElementById("progress-section").style.display = habits.length ? "block" : "none";
    document.getElementById("stats-section").style.display = habits.length ? "block" : "none";

    const done = habits.filter(h => h.completedDays.includes(today)).length;
    const pct = habits.length ? Math.round(done / habits.length * 100) : 0;
    document.getElementById("progress-text").textContent = `${done} / ${habits.length} hoy`;
    document.getElementById("progress-pct").textContent = `${pct}%`;
    document.getElementById("progress-fill").style.width = pct + "%";

    const list = document.getElementById("habits-list");
    list.innerHTML = "";
    habits.forEach(h => {
      const isDone = h.completedDays.includes(today);
      const s = computeStreak(h);
      const streakLabel = s === 0 ? "Sin racha" : s === 1 ? "🔥 1 día seguido" : `🔥 ${s} días seguidos`;
      const li = document.createElement("li");
      li.className = "habit-item" + (isDone ? " done" : "");
      li.innerHTML = `
        <input type="checkbox" class="habit-check" ${isDone ? "checked" : ""} data-id="${h.id}" />
        <span class="habit-emoji">${h.emoji}</span>
        <div class="habit-info">
          <div class="habit-name">${esc(h.name)}</div>
          <div class="habit-streak${s >= 3 ? " hot" : ""}">${streakLabel}</div>
        </div>
        <button class="habit-del" data-del="${h.id}" aria-label="Eliminar">✕</button>
      `;
      list.appendChild(li);
    });

    const best = habits.reduce((m, h) => Math.max(m, computeStreak(h)), 0);
    const total = habits.reduce((sum, h) => sum + h.completedDays.length, 0);
    document.getElementById("stats-grid").innerHTML = [
      { v: habits.length, l: "Hábitos" },
      { v: done, l: "Completados hoy" },
      { v: best, l: "🔥 Mejor racha" },
      { v: total, l: "Total histórico" },
    ].map(({ v, l }) => `<div class="stat-card"><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div>`).join("");
  }

  // ── Eventos ──
  document.getElementById("add-form").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("habit-input");
    const name = input.value.trim();
    if (!name) return;
    state.habits.push({ id: Date.now().toString(), name, emoji: document.getElementById("habit-emoji").value, completedDays: [], createdAt: todayKey() });
    save(state);
    input.value = "";
    input.focus();
    render();
  });

  document.getElementById("habits-list").addEventListener("change", e => {
    if (!e.target.classList.contains("habit-check")) return;
    const h = state.habits.find(x => x.id === e.target.dataset.id);
    if (!h) return;
    const today = todayKey(), idx = h.completedDays.indexOf(today);
    idx === -1 ? h.completedDays.push(today) : h.completedDays.splice(idx, 1);
    save(state); render();
  });

  document.getElementById("habits-list").addEventListener("click", e => {
    const btn = e.target.closest("[data-del]");
    if (!btn) return;
    if (!confirm(`¿Eliminar "${state.habits.find(h=>h.id===btn.dataset.del)?.name}"?`)) return;
    state.habits = state.habits.filter(h => h.id !== btn.dataset.del);
    save(state); render();
  });

  // ── PWA Install ──
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("install-banner").style.display = "flex";
  });

  document.getElementById("install-btn").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (outcome === "accepted") document.getElementById("install-banner").style.display = "none";
  });

  document.getElementById("install-close").addEventListener("click", () => {
    document.getElementById("install-banner").style.display = "none";
  });

  // ── Init ──
  document.getElementById("date-display").textContent = formatDate(todayKey());
  render();
</script>
</body>
</html>
